repository = "https://github.com/Compliatory/MedUI"
version = "0.3.0-rc.1"
commit = "9a57f6462b6f8dbdf1f0b8b4519674f1c6235dbb"
capabilities = ["syntax", "semantics", "layout", "safety"]
# Diagnostic position precision, per `spec/diagnostics.md`. The lexer carries exact 1-based UTF-8
# byte columns, so every pinned position is matched in full.
positions = "full"
# Optional observation profiles (MEDUI-DEC-007). A string array, not `[[profiles]]`: `mdux.tools.toml`
# has no array-of-tables, and `conformance_spec` synthesizes the schema's `{ id, version: 1 }` shape.
# RENDERED (R01-R04) is gated against `mdux.verify`'s own arithmetic; EVIDENCE (E01-E03) is gated as
# aggregate list logic over the 31 aggregate-evidence vectors and the 29 evidence contract cases.
profiles = ["MEDUI-PROFILE-RENDERED", "MEDUI-PROFILE-EVIDENCE"]
