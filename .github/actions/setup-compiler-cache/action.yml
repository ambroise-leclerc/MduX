name: Set up the compiler cache
description: >
  Installs cppmcache with its project's setup action, checks the archive that action downloaded
  against a digest pinned here, restores the cache develop saved, and bounds its size (#392).
  Saving stays with the calling job, after its build: a composite action has no post step, and the
  save policy (develop pushes only) belongs to the workflow.

inputs:
  key:
    description: >
      Prefix of the actions/cache key, unique per job: jobs that build differently (compiler,
      sanitizers) must not restore each other's caches.
    required: true

runs:
  using: composite
  steps:
    # cppmcache keys a module consumer on the content of every BMI it imports and restores the BMI
    # a provider produces, so named-module providers and consumers are cached on every toolchain;
    # ccache, which #386 made persistent, could only be trusted with Clang consumers.
    # build.cache.namedModuleIntegrity proves a changed BMI still invalidates its consumers. The
    # action sets CPPMCACHE_DIR, CPPMCACHE_BASEDIR and CPPMCACHE_COMPILERCHECK=content; its own
    # actions/cache step is off, because saving and restoring follow this repository's policy.
    - name: Install cppmcache
      uses: ambroise-leclerc/cppmcache@0b942162c5c6e751372b0eed9c4c4f9413618eed # v0.1.1
      with:
        version: 0.1.1
        cache: "false"

    # The commit pin above covers the action's script, not the binary: the action downloads the
    # archive by version and checks it against a SHA256SUMS file from the same release, which
    # detects corruption but not a replaced release asset. The digests below are the v0.1.1
    # release's, recorded here so that a substituted upload fails this step, as lavapipe's does in
    # windows-build.yml. A change of version is a change of these three lines. The archive path is
    # the action's own; if it moves, the file is missing and the step fails rather than passing.
    - name: Check the cppmcache archive against its pinned digest
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            name="cppmcache-0.1.1-linux-x86_64.tar.gz"
            expected="e42298417afdeafb9cddde5b0126702578423235ee968a23a4fe354229de8671" ;;
          macOS-ARM64)
            name="cppmcache-0.1.1-macos-arm64.tar.gz"
            expected="4742849d49aa7507290b07e0b41da981e4073fc5fb52b81bf961efd7a66c5e18" ;;
          Windows-X64)
            name="cppmcache-0.1.1-windows-x86_64.zip"
            expected="1bfa02d521f4defd344783e6fdc84ee0f4adfb1f8185528cf4dfd9ea5344cf16" ;;
          *)
            echo "::error::No pinned cppmcache digest for ${RUNNER_OS} ${RUNNER_ARCH}."
            exit 1 ;;
        esac
        archive="${RUNNER_TEMP}/cppmcache-download/${name}"
        if [ ! -f "$archive" ]; then
          echo "::error::${archive} not found: the setup action no longer leaves its download there."
          exit 1
        fi
        # Read from standard input, as the action does: given a Windows path, sha256sum prefixes
        # its digest with a backslash.
        if command -v sha256sum > /dev/null; then
          actual="$(sha256sum < "$archive" | cut -d' ' -f1)"
        else
          actual="$(shasum -a 256 < "$archive" | cut -d' ' -f1)"
        fi
        if [ "$actual" != "$expected" ]; then
          echo "::error::${name} has digest ${actual}; the pinned digest is ${expected}."
          exit 1
        fi
        echo "${name}: ${actual}"

    # Pull requests restore the newest cache develop saved and never save their own, so one branch
    # cannot seed another's objects.
    - name: Restore the compiler cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cppmcache-cache
        key: ${{ inputs.key }}-${{ github.sha }}
        restore-keys: ${{ inputs.key }}-

    # cppmcache has no eviction. A restored cache that has grown past 1 GiB, the limit the Clang and
    # macOS jobs gave ccache, is dropped whole, and this run repopulates it. The check is made
    # before the build on purpose: made before the save, it would have develop save an empty cache.
    # What is saved can therefore exceed the limit, by at most what one build adds, until the next
    # run.
    - name: Bound the compiler cache
      shell: bash
      run: |
        size_mb="$(du -sm "$CPPMCACHE_DIR" 2>/dev/null | cut -f1)"
        echo "compiler cache: ${size_mb:-0} MiB"
        if [ "${size_mb:-0}" -gt 1024 ]; then
          cppmcache -C
        fi
