name: Sanitizers

# AddressSanitizer and UndefinedBehaviorSanitizer over the test suite (issue #179).
#
# This exists because a green ordinary build proves less than it looks like it does here. ASan
# found a heap-use-after-free in TruetypeTests.cpp during #171 - a test parsing from a temporary
# while `tt::Font` held non-owning spans - and found a second one of exactly the same shape in
# SchemaTests.cpp the first time this workflow was written. Both suites had been passing for
# months. The tree is full of hand-rolled binary parsing over spans, which is the code where that
# bug lives, so the instrumented run is not a formality.

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head - see linux-gcc16-build.yml for why the list reads
    # this way and what `[0-9]+-*` is.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]
  schedule:
    # Catches a regression that lands through a path with no PR, and keeps the job from rotting
    # unnoticed between changes that happen to touch it.
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Pushes to develop and master
# are never cancelled: the post-merge run is the evidence a stacked successor waits for (AGENTS.md
# "Stacked delivery").
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only edits prose skips the build job below; see the called workflow for the
  # rule. The build job's condition is `code != 'false'` under `!cancelled()`, so a classifier that
  # failed or produced nothing selects the build rather than skipping it.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  sanitize:
    name: ASan + UBSan (GCC 16)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Pinned to a patch release, not the floating `gcc:16` tag. That tag moved from 16.1.0 to
    # 16.2.0 on 2026-08-12 and turned develop red on a markdown-only commit (#205): GCC 16.2 could
    # not read the module BMIs the SpecLab sources produce - "failed to read compiled module
    # cluster ... Bad file data". The BMI format is not stable across GCC patch releases, and every
    # other input to this job is already pinned (SpecLab to a commit SHA, CMake to 4.3.6), so the
    # compiler was the one floating input - and the one most likely to break a C++23 modules build.
    #
    # Same reasoning as the CMake pin in windows-build.yml, which that file states at length after
    # the same thing happened with `latest`. Moving to a newer GCC is a deliberate change: bump this
    # tag in a PR of its own, so the diff that changes the compiler is the diff that fixes whatever
    # the change breaks.
    container: gcc:16.1.0
    env:
      # Tests are independent processes - no RUN_SERIAL, RESOURCE_LOCK or fixed port anywhere - and
      # most of a case's wall time is process start-up, so they run in parallel (#386).
      CTEST_PARALLEL_LEVEL: '4'
      MEDUI_CONFORMANCE_DIR: ${{ github.workspace }}/.medui-conformance

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    - name: Resolve the pinned MedUI contract commit
      id: medui-contract
      shell: bash
      run: |
        set -euo pipefail
        commit="$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' medui-conformance.toml)"
        if [ -z "$commit" ]; then
          echo "medui-conformance.toml has no 40-character commit pin" >&2
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned MedUI conformance contract
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Compliatory/MedUI
        ref: ${{ steps.medui-contract.outputs.commit }}
        path: .medui-conformance
        persist-credentials: false

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          vulkan-utility-libraries-dev \
          spirv-tools \
          mesa-vulkan-drivers \
          vulkan-validationlayers \
          libglfw3-dev \
          libwayland-dev \
          wayland-protocols \
          wayland-utils \
          libwayland-egl1 \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          xvfb \
          wget \
          gnupg \
          gcovr

    - name: Install pinned CMake
      run: |
        # Download to RUNNER_TEMP, not the checkout root, matching linux-gcc16-build.yml.
        CMAKE_VERSION="4.3.6"
        CMAKE_ARCHIVE="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
        # Pinned SHA-256 from Kitware's own cmake-4.3.6-SHA-256.txt manifest. `sha256sum -c` exits
        # non-zero on a mismatch and `set -e` is on by default in a `run:` block, so extraction
        # cannot proceed past a substituted download.
        CMAKE_SHA256="fba967b44c7b40f155f9492dacb5477aab8333699986e1e07a7d90803aba7219"
        wget -O "$CMAKE_ARCHIVE" https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        echo "${CMAKE_SHA256}  ${CMAKE_ARCHIVE}" | sha256sum -c -
        tar -xzf "$CMAKE_ARCHIVE" -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version

    # Not through a preset: the sanitizer build is deliberately not one of the configurations
    # CMakePresets.json describes, because it is not a configuration anything ships. Debug, since
    # ASan's reports are unreadable without frame pointers and line numbers, and examples off
    # because nothing here runs them.
    #
    # It also carries --coverage (#386): this is already the one Debug build that runs every test,
    # so it measures line coverage for the price of the instrumentation rather than a build of its
    # own. Through CMAKE_<LANG>_FLAGS, so every translation unit - MduXCore included - is counted.
    #
    # `enable_sanitizers()` in cmake/Sanitizers.cmake already carries these options; this job is
    # the first thing to switch them on. It also adds -fno-sanitize-recover=all, so a UBSan
    # violation aborts instead of printing into a passing log. Since #360 it puts both on every
    # translation unit the build compiles, MduXCore included, rather than on the Vulkan-carrying
    # options target that the governed code never links.
    - name: Configure with ASan and UBSan
      run: |
        cmake -S . -B build-asan -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DMDUX_BUILD_PREVIEW=ON \
          -DMDUX_BUILD_TESTS=ON \
          -DMDUX_BUILD_EXAMPLES=OFF \
          -DENABLE_SANITIZER_ADDRESS=ON \
          -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON \
          "-DCMAKE_CXX_FLAGS=--coverage" \
          "-DCMAKE_C_FLAGS=--coverage" \
          "-DCMAKE_EXE_LINKER_FLAGS=--coverage" \
          "-DCMAKE_SHARED_LINKER_FLAGS=--coverage"

    # detect_leaks=0 for the build itself, which became a thing that renders when #254 made
    # verification.json a bake output: `mdux-verify-bake` runs here, sanitized, against lavapipe,
    # and LeakSanitizer reports the same driver-owned 240 bytes through `<unknown module>` that the
    # rendered-truth step below documents at length. It is not suppressible by name for the reason
    # given there.
    #
    # Nothing is lost by scoping it this way. The other bakers that run during this build are driven
    # as library calls by `medui_tools_spec` and friends in the leak-detecting step below, so an
    # owner dropped in a baker is still caught - by the step whose job that is, rather than here.
    - name: Build
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: cmake --build build-asan

    # Before anything runs: a green result below is evidence only about code that was instrumented.
    # This job once passed for months with 0 of MduXCore's 46 translation units compiled with
    # -fsanitize (#360). The check reads compile_commands.json and fails on any translation unit
    # whose options - evaluated in order, so a later -fno-sanitize= or -fsanitize-recover= counts -
    # leave a sanitizer off or recovery on, or on a named target that compiled nothing. --no-tests=error: a
    # configuration that stopped registering it must fail here, not skip it.
    - name: Verify every translation unit is instrumented
      run: ctest --test-dir build-asan -L sanitizer-coverage --output-on-failure --no-tests=error

    # Everything except the suites that talk to a GPU driver. Leak detection is on here, which is
    # the half that catches an owner dropped on the floor.
    #
    # Selected by label, not by name. Every suite that renders through a device carries `pixel` or
    # `verify`, and a name list drifted: the scenario verifier (#321) and verify_ui_spec's
    # RENDERED-envelope check (#314) render through lavapipe too, were never added to it, and from
    # 2026-11-24 failed this step intermittently on the driver's own thread-start leak - on develop
    # as well as on pull requests, at a commit that had passed for weeks.
    - name: Run tests under ASan and UBSan
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        # Wait for the display before any test needs it (#386). This used to be implicit: ctest ran
        # serially and reached the windowed smoke test hundreds of tests later. In parallel it gets there
        # in under a second, before Xvfb listens, and GLFW then fails to initialise.
        for _ in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
        [ -S /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb did not start on :99"; exit 1; }
        # --no-tests=error: a filter that matched nothing would otherwise be a pass. The whole
        # point of this job is that it ran.
        # `conformance` and `sanitizer-coverage` are excluded too: a named step runs each (#386).
        ctest --test-dir build-asan -LE 'pixel|verify|conformance|sanitizer-coverage' --output-on-failure --no-tests=error

    # Shared MedUI observation-profile conformance (#314), broken out with -V so the vector count and
    # pinned SHA are visible, and run under the sanitizers because the R04 ROI slicing and the JSON
    # walk are exactly the kind of index arithmetic ASan is here to check. --no-tests=error: an empty
    # label must fail this job, whose whole point is that it ran.
    - name: Verify MedUI profile conformance under ASan and UBSan
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --test-dir build-asan -L conformance -V --no-tests=error

    # Every `pixel`- or `verify`-labelled suite - offscreen_tests, verify_ui_pixel_test, preview.pixel,
    # the verify.screen.<id> and verify.scenario.<id> gates, verify_scenario_spec's replay scenarios
    # and verify_ui_spec's RENDERED-envelope check - runs against lavapipe, and the Vulkan ICD leaks 512
    # bytes once, on a thread it starts itself, through pthread_once - a stack with no MduX frame in
    # it at all. That is the driver's allocation to free, not this project's, and it is not
    # suppressible by name because the frames resolve to `<unknown module>`.
    #
    # So leak detection is off for these suites only. Every other ASan check - use-after-free,
    # buffer overflow, use-after-scope - stays on, and those are the ones that matter for code
    # that renders through spans into mapped memory. A suite skipped entirely would be the worse
    # trade.
    - name: Run rendered-truth tests under ASan, without leak detection
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        # Wait for the display before any test needs it (#386). This used to be implicit: ctest ran
        # serially and reached the windowed smoke test hundreds of tests later. In parallel it gets there
        # in under a second, before Xvfb listens, and GLFW then fails to initialise.
        for _ in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
        [ -S /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb did not start on :99"; exit 1; }
        # offscreen_tests and verify_ui_pixel_test exit 77 with no loader, no ICD or no device, and
        # tests/CMakeLists.txt sets SKIP_RETURN_CODE 77 so CTest reports that as Skipped - which does
        # not fail a run. The verify.screen.<id> gates have no such status and fail outright; the
        # grep below is for the first two.
        # Without the check below, a runner that lost its ICD would turn the sanitized half of the
        # render path into a silent no-op and this job would stay green, which is the same shape as
        # the CodeQL database that analysed two files. linux-gcc16-build.yml guards its pixel step
        # the same way and for the same reason.
        # A `run:` block gets `bash -e`, which is not `bash -eo pipefail`: without this line the
        # pipeline below reports tee's status, so a failing ctest would pass the step. Demonstrated
        # rather than assumed - `false | tee /dev/null` exits 0 under `bash -e` and 1 with pipefail.
        set -o pipefail
        LOG="$RUNNER_TEMP/asan-pixel.log"
        ctest --test-dir build-asan -L 'pixel|verify' --output-on-failure --no-tests=error 2>&1 | tee "$LOG"
        if grep -q "Skipped" "$LOG"; then
          echo "::error::a rendered-truth test was skipped - no Vulkan device, so part of the render path was not sanitized"
          exit 1
        fi

    # The same attachment the three render legs make, for the same reason (#255): a sanitized
    # verification failure is still a failure a reader should be able to see rather than reconstruct.
    # Line coverage of the code this job just exercised (#386): every test above ran in this build,
    # so the counters cover the whole suite. A measurement, not a gate - there is no threshold yet,
    # and a reporting failure (a gcov format gcovr does not know, say) warns rather than turning a
    # clean sanitizer run red. The summary lands on the run page; the HTML report is an artifact.
    #
    # Read tools/preview's figure with care: the preview tests stop mdux-preview with a signal, and a
    # process that does not exit normally never writes its counters, so that directory reports far
    # less than the tests actually execute.
    - name: Report line coverage
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/coverage"
        # The gcov that matches the compiler: the image's GCC 16 one comes first on PATH, and a
        # gcov from another GCC release cannot read these notes files ("version 'B61*', prefer
        # 'B52*'"). The nested builds the install-tree and compiler-cache tests run are excluded:
        # their sources are not in this checkout.
        gcov --version | head -1
        if ! gcovr --root . --object-directory build-asan -j 4 \
               --gcov-executable "$(command -v gcov)" \
               --gcov-exclude-directories '.*/_test_consumer_build/.*' \
               --gcov-exclude-directories '.*/CMakeFiles/[0-9.]+/.*' \
               --filter 'src/' --filter 'include/' --filter 'tools/' \
               --exclude-unreachable-branches --exclude-throw-branches \
               --txt-summary --html-details "$RUNNER_TEMP/coverage/index.html" \
               | tee "$RUNNER_TEMP/coverage/summary.txt"; then
          echo "::warning::gcovr could not produce a coverage report for this build."
          exit 1
        fi
        {
          echo '### Line coverage (ASan + UBSan, GCC 16)'
          echo '```'
          cat "$RUNNER_TEMP/coverage/summary.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-asan-gcc16
        path: ${{ runner.temp }}/coverage/
        if-no-files-found: ignore

    # Always, and cheap: the build's own timing record, so the next person tuning this leg's critical
    # path starts from a measurement rather than a guess (#386). Read it with ninjatracing or any
    # .ninja_log viewer.
    - name: Upload the build timing log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ninja-log-asan
        path: build-asan/.ninja_log
        if-no-files-found: warn
        # The log is a dotfile, and upload-artifact skips hidden files unless told otherwise.
        include-hidden-files: true

    - name: Upload the rendered-truth diff images
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-diff-asan
        path: build-asan/verify-diff/
        if-no-files-found: ignore
