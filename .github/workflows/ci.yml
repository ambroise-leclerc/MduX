  #     run: |
  #       export DISPLAY=:99
  #       Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
  #       ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

  # Compliance and Documentation Build
  compliance-docs:
    name: Compliance & Documentation
    runs-on: ubuntu-latest
    container: gcc:16
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          doxygen \
          graphviz \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          libwayland-dev \
          wayland-protocols \
          wayland-scanner++ \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          wget \
          gnupg
          
    - name: Install latest CMake
      run: |
        # Install CMake 4.x for C++23 import std support via direct download
        # Avoid libssl1.1 dependency issues in Debian containers
        CMAKE_VERSION="4.1.1"
        wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version
        
    - name: Configure with regulatory documentation
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMDUX_BUILD_DOCS=ON -DMDUX_ENABLE_REGULATORY_DOCS=ON
      
    - name: Build documentation
      run: cmake --build build --target doxygen-docs
      
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: medical-device-documentation
        path: build/html/
        retention-days: 30

  # Security and Code Quality
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    container: gcc:16
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          cppcheck \
          clang-tidy \
          wget \
          gnupg \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev
          
    - name: Install latest CMake
      run: |
        # Install CMake 4.x for C++23 import std support via direct download
        # Avoid libssl1.1 dependency issues in Debian containers
        CMAKE_VERSION="4.1.1"
        wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version
          
    - name: Run static analysis
      run: |
        # Static analysis with cppcheck
        cppcheck --enable=all --std=c++23 --suppress=missingInclude include/ examples/ tests/ || true

        # Configure for clang-tidy
        cmake -B build -S . -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMDUX_BUILD_EXAMPLES=ON -DMDUX_BUILD_TESTS=ON

        # Run clang-tidy on key files (if available)
        if command -v clang-tidy &> /dev/null; then
          find include/ -name "*.hpp" -exec clang-tidy {} -p build \; || true
        fi

  # Documentation and regulatory citation lint - no C++ toolchain needed, so a
  # docs-only PR gets fast feedback without waiting on the full build matrix.
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run mdux-docs-lint
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        python3 -m unittest discover -s tools/docs-lint -p "test_*.py"
        python3 tools/docs-lint/mdux_docs_lint.py

    # Every AI-Reference.md is generated, so an edited module with a stale index is a defect the
    # build should catch rather than a reader. --check writes nothing; it fails when regenerating
    # would change a byte, and when a clause is cited in prose that no index row covers.
    - name: Check AI-Reference indexes are current
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: python3 tools/docs-lint/generate_ai_reference.py --check

    # Issue #33: the alignment between docs/<standard>/schemas/*.json and the governance types is
    # the point of those schemas. A schema that has silently diverged from the type it documents
    # still looks authoritative, which is what makes the drift worth failing a build over.
    - name: Check schemas have not drifted from the governance types
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: python3 tools/docs-lint/check_schema_type_drift.py

  evidence-lint:
    name: Evidence Pipeline Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bans decimal float formatting anywhere in the evidence pipeline (ADR-007). Needs no build,
    # so it runs as its own fast job rather than inside a toolchain leg.
    - name: Run mdux-evidence-lint
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        python3 -m unittest discover -s tools/evidence-lint -p "test_*.py"
        python3 tools/evidence-lint/mdux_evidence_lint.py

    # There used to be a second step here checking that every committed report.json's
    # toolGitSha wasn't "unknown". That field no longer exists: BakeReport dropped it entirely
    # after review found it structurally unsound for a byte-compared, committed artifact - the
    # SHA of the commit containing report.json can't be known while that file is being written,
    # so an embedded "current commit" value could never survive being committed and re-baked.
    # See ADR-007, decision 5, and issue #52. toolVersion is the report's only tooling identity
    # now, and it needs no CI check beyond validate()'s existing EmptyToolVersion rejection.
