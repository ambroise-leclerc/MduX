  #     run: |
  #       export CC=clang-20
  #       export CXX=clang++-20
  #       cmake -B build -S . -G Ninja \
  #         -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
  #         -DCMAKE_C_COMPILER=clang-20 \
  #         -DCMAKE_CXX_COMPILER=clang++-20 \
  #         -DMDUX_BUILD_EXAMPLES=ON \
  #         -DMDUX_BUILD_TESTS=ON \
  #         -DMDUX_BUILD_DOCS=OFF
  #     
