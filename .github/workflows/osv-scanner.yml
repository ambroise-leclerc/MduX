name: OSV-Scanner

# Report-only: uses Google's reusable workflows, which upload results as SARIF to the Security
# tab. fail-on-vuln must be set explicitly - the reusable workflows default it to true, which
# would otherwise turn every PR red on a newly-disclosed CVE, the opposite of the non-blocking
# cppcheck/clang-tidy pattern the rest of CI follows. Covers the two CPM-fetched dependencies
# (Catch2 in tests/CMakeLists.txt, glfw in examples/CMakeLists.txt) and the pinned GitHub Actions
# versions used across .github/workflows/.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ main, develop, '[0-9]+-*', 'feat/**' ]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  # actions: read is required by the called reusable workflow to upload SARIF (see
  # https://github.com/github/codeql-action/issues/2117) - a called workflow's permissions
  # block can only narrow what the caller grants, never add to it, so it must be listed here too.
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
