name: OSV-Scanner

# Report-only: uses Google's reusable workflows, which upload results as SARIF to the Security
# tab. fail-on-vuln must be set explicitly - the reusable workflows default it to true, which
# would otherwise turn every PR red on a newly-disclosed CVE, the opposite of the non-blocking
# cppcheck/clang-tidy pattern the rest of CI follows.
#
# What it can see is whatever manifest or lockfile the checkout contains (`-r ./`). The three
# CPM-fetched dependencies - SpecLab (tests/CMakeLists.txt), GLFW (examples/CMakeLists.txt) and
# cpp-httplib (tools/CMakeLists.txt) - have none: their pins live in CMake calls, which the scanner
# does not read. So this job does not cover them. Their versions and anomaly tracking are recorded
# in docs/governance/soup-register.toml instead, and giving the scanner an inventory it can read is
# separate work (#382).

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]
  schedule:
    - cron: '30 6 * * 1'

# Restrictive by default. A called workflow's own permissions block can only narrow what the
# caller grants, never add to it, so the SARIF upload's scopes must come from the caller - but from
# the *job* that makes the call, not from here. Granting `security-events: write` workflow-wide
# hands it to every job whether it uploads anything or not, which is what Scorecard's
# Token-Permissions check flags.
permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Every other run - a push to
# develop or master, a schedule, a dispatch - gets a group of its own (its run id), so it is never
# cancelled and never replaced. A shared per-branch group would not be enough even without
# cancel-in-progress: GitHub keeps one pending run per group, so a third push would silently replace
# the second's queued run, and that develop commit would never get the post-merge run a stacked
# successor waits for (AGENTS.md "Stacked delivery").
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    permissions:
      # actions: read is required by the upload step inside the reusable workflow
      # (https://github.com/github/codeql-action/issues/2117).
      actions: read
      security-events: write
      contents: read
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./

  scan-pr:
    permissions:
      actions: read
      security-events: write
      contents: read
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
