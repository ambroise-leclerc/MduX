name: Compliance & Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ main, develop, '[0-9]+-*', 'feat/**' ]

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  # Compliance and Documentation Build
  compliance-docs:
    name: Compliance & Documentation
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          doxygen \
          graphviz \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          libwayland-dev \
          wayland-protocols \
          wayland-scanner++ \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          wget \
          gnupg

    - name: Install latest CMake
      run: |
        # Install CMake 4.x for C++23 import std support via direct download
        # Avoid libssl1.1 dependency issues in Debian containers
        CMAKE_VERSION="4.1.1"
        # Pinned SHA-256 from Kitware's own cmake-4.1.1-SHA-256.txt manifest. The tarball is
        # unpacked into /opt and put on PATH, so it builds everything this job touches; verifying
        # it is the same supply-chain discipline the SHA-pinned actions above apply. `sha256sum -c`
        # exits non-zero on a mismatch and `set -e` is on by default in a `run:` block, so
        # extraction cannot proceed past a bad or substituted download.
        CMAKE_SHA256="5a6c61cb62b38e153148a2c8d4af7b3d387f0c8c32b6dbceb5eb4af113efd65a"
        wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        echo "${CMAKE_SHA256}  cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | sha256sum -c -
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version

    - name: Configure with regulatory documentation
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMDUX_BUILD_DOCS=ON -DMDUX_ENABLE_REGULATORY_DOCS=ON

    - name: Build documentation
      run: cmake --build build --target doxygen-docs

    - name: Upload documentation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: medical-device-documentation
        path: build/html/
        retention-days: 30
