name: Linux GCC 16 Build

# NOTE: This project requires C++23 import std support:
# - GCC 16+ ✅ Available via the gcc Docker image, pinned to a patch release below

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]

permissions:
  contents: read

jobs:
  # Linux Build with GCC 16 container
  linux-build-gcc16:
    name: Linux (GCC 16, Vulkan)
    runs-on: ubuntu-latest
    # Pinned to a patch release, not the floating `gcc:16` tag. That tag moved from 16.1.0 to
    # 16.2.0 on 2026-08-12 and turned develop red on a markdown-only commit (#205): GCC 16.2 could
    # not read the module BMIs the SpecLab sources produce - "failed to read compiled module
    # cluster ... Bad file data". The BMI format is not stable across GCC patch releases, and every
    # other input to this job is already pinned (SpecLab to a commit SHA, CMake to 4.1.1), so the
    # compiler was the one floating input - and the one most likely to break a C++23 modules build.
    #
    # Same reasoning as the CMake pin in windows-build.yml, which that file states at length after
    # the same thing happened with `latest`. Moving to a newer GCC is a deliberate change: bump this
    # tag in a PR of its own, so the diff that changes the compiler is the diff that fixes whatever
    # the change breaks.
    container: gcc:16.1.0
    env:
      MEDUI_CONFORMANCE_DIR: ${{ github.workspace }}/.medui-conformance

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    - name: Resolve the pinned MedUI contract commit
      id: medui-contract
      shell: bash
      run: |
        set -euo pipefail
        commit="$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' medui-conformance.toml)"
        if [ -z "$commit" ]; then
          echo "medui-conformance.toml has no 40-character commit pin" >&2
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned MedUI conformance contract
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Compliatory/MedUI
        ref: ${{ steps.medui-contract.outputs.commit }}
        path: .medui-conformance
        persist-credentials: false

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          vulkan-utility-libraries-dev \
          spirv-tools \
          mesa-vulkan-drivers \
          vulkan-validationlayers \
          libglfw3-dev \
          libwayland-dev \
          wayland-protocols \
          wayland-utils \
          libwayland-egl1 \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          xvfb \
          wget \
          gnupg

    - name: Install latest CMake
      run: |
        # Download to RUNNER_TEMP, not the checkout root - the archive would
        # otherwise trip "Verify no source-tree writes" below.
        CMAKE_VERSION="4.1.1"
        CMAKE_ARCHIVE="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
        wget -O "$CMAKE_ARCHIVE" https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        tar -xzf "$CMAKE_ARCHIVE" -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version

    - name: Verify compiler and tools
      run: |
        gcc --version
        g++ --version
        cmake --version
        ninja --version

    # Through the preset, not a hand-written configure line. CMakePresets.json describes
    # ninja-gcc as mirroring what this job runs, and the only way that statement stays true is
    # for the job to actually use it - otherwise the preset is unexercised by CI and free to rot.
    - name: Configure CMake
      run: cmake --preset ninja-gcc

    - name: Build
      run: cmake --build --preset ninja-gcc

    - name: Run Tests
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        ctest --preset ninja-gcc --output-on-failure

    # The second toolchain for the byte-identity check (ADR-007). With the GCC 15 leg retired
    # this pairs with MSVC: an artifact that is byte-identical on two unrelated toolchains is the
    # claim ADR-007 makes, and one leg alone could not falsify it.
    - name: Verify evidence artifacts (GCC 16)
      run: ctest --preset ninja-gcc -L evidence --output-on-failure

    # The second toolchain for the determinism contract (ADR-008, issue #59). Pairs with the MSVC
    # step: two unrelated compilers, standard libraries and code generators producing identical
    # bit patterns is the evidence, and it is why expF32() exists rather than std::exp - see
    # ADR-008 decision 3.
    - name: Verify ML determinism (GCC 16)
      run: ctest --preset ninja-gcc -L determinism --output-on-failure

    # Governed-zone no-throw, at the object level (ADR-005, issue #116). Broken out with -V rather
    # than folded into the full run above, because a passing ctest prints none of a test's output -
    # and this scan's output is half its purpose. It reports the throw-helper references it
    # deliberately tolerates, and the ADR justifies tolerating them on the grounds that they stay
    # "visible and counted". A number nobody can see in a job log is not counted. -V is what makes
    # the claim true, and is the same reason the pixel step below uses it.
    - name: Verify governed-zone no-throw (GCC 16)
      run: ctest --preset ninja-gcc -L governed -V --no-tests=error

    # Rendered-truth verification (issue #125), moved here when the GCC 15 leg was retired.
    # Without it a broken ICD turns the only test that renders anything into a silent no-op:
    # offscreen_tests exits 77 with no device and CTest reports Skipped, which does not fail a run.
    #
    # The loader is left to choose its own driver rather than being pinned with VK_DRIVER_FILES.
    # Pinning was tried and was worse: the hardcoded ICD path does not exist on this image, so it
    # turned a working device into no device. radv and anv report nothing on a runner with no GPU
    # and the loader falls through to lavapipe by itself.
    - name: Verify rendered output
      run: |
        echo "Available Vulkan ICDs:"
        ls -1 /usr/share/vulkan/icd.d/ || true
        # The log goes to $RUNNER_TEMP, not the workspace. Written into the checkout it would be
        # covered by .gitignore's `*.log` - so the "Verify no source-tree writes" step below could
        # not see it, and, more to the point, could not see any other .log a build step wrote
        # either. Keeping this file outside the tree keeps that check honest.
        # Same reason as the sanitizer leg: `run:` gets `bash -e`, not `bash -eo pipefail`, so the
        # `| tee` below would otherwise report tee's status and let a failing pixel run pass. This
        # predates #179 and was found while reviewing the copy of this step made for it.
        set -o pipefail
        PIXEL_LOG="$RUNNER_TEMP/pixel.log"
        # -V rather than --output-on-failure: a passing run must still print, because two of the
        # things this step verifies are only visible in the output of tests that succeeded.
        ctest --preset ninja-gcc -L pixel -V --no-tests=error 2>&1 | tee "$PIXEL_LOG"
        if grep -q "Skipped" "$PIXEL_LOG"; then
          echo "::error::Pixel tests were skipped - no Vulkan device. They must run on this leg."
          exit 1
        fi
        # The validation layers decide whether this suite's layout and synchronisation assertions
        # check anything. Installing the package does not prove the layer loads, so the run says
        # which it was and this fails if it was not loaded - otherwise those assertions could go
        # quietly vacuous and the log would look identical.
        if ! grep -q "validation layers enabled" "$PIXEL_LOG"; then
          echo "::error::Validation layers did not load on this leg - the layout and sync assertions are vacuous."
          grep -i "validation layers" "$PIXEL_LOG" || true
          exit 1
        fi

    # The gate epic #16 opens with: `mdux-verify-ui --screen=generated/screen/<id> --locales=all`,
    # over every committed screen, on this leg's lavapipe. `mdux_compile_screen()` registers one
    # `verify.screen.<id>` per screen, so a second committed screen is covered here without this file
    # changing - and `--no-tests=error` is what makes that automatic rather than silent: a label that
    # matched nothing would otherwise pass this step over zero screens.
    #
    # A skip means the driver found no Vulkan device, which is exit 77 and nothing else's - every
    # other impossibility exits 3 and fails. #254 already made an absent device a build failure on
    # this leg, so a skip here would mean the device went away between the bake and the tests; it is
    # asserted rather than tolerated for the reason the pixel step above gives.
    - name: Verify committed screens against their goldens (lavapipe)
      shell: bash
      run: |
        set -euo pipefail
        verify_log="$RUNNER_TEMP/gcc16-verify.log"
        ctest --preset ninja-gcc -L verify -V --no-tests=error 2>&1 | tee "$verify_log"
        if grep -q 'Skipped' "$verify_log"; then
          echo '::error::Rendered-truth verification skipped - no Vulkan device. It must run on this leg.'
          exit 1
        fi


    - name: Verify no source-tree writes
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "Build wrote into the source tree (generated/ artifacts must be staged via mdux-bake-update, never produced by a normal build):"
          echo "$status"
          exit 1
        fi

    # Last in the job. `if: failure()` is evaluated where the step sits, so an upload placed above a
    # step that can fail is skipped before that failure happens - see the same step in
    # macos-arm64-build.yml, where it was doing exactly that. Only on failure. The image is a measurement of the frame rather than a property
    # of the screen, so ADR-014 decision 4 keeps it out of `generated/` and #255 makes it an
    # attachment instead - which is worth nothing unless it is actually attached. `if-no-files-found`
    # is `ignore` because a failure that is not a rendered one (an unreadable artifact, a digest
    # drift) legitimately produces no image, and a red step should not gain a second red mark saying
    # so.
    - name: Upload the rendered-truth diff images
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: verify-diff-gcc16
        path: build-gcc/verify-diff/
        if-no-files-found: ignore
