name: Lint

# Every check here is standard-library Python that needs no C++ toolchain, so a PR touching no C++ at
# all - a docs-only PR, or one that only adds a file - still gets these answers in well under a
# minute. They were three workflows (Documentation Lint, Evidence Pipeline Lint, Governed Source
# Lint), each starting its own runner for about ten seconds of work; #386 made them one job with one
# named step per check, so a failure is still reported by name.

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Every other run - a push to
# develop or master, a schedule, a dispatch - gets a group of its own (its run id), so it is never
# cancelled and never replaced. A shared per-branch group would not be enough even without
# cancel-in-progress: GitHub keeps one pending run per group, so a third push would silently replace
# the second's queued run, and that develop commit would never get the post-merge run a stacked
# successor waits for (AGENTS.md "Stacked delivery").
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    # Documentation and regulatory citation lint, including the prohibition on reproduced
    # normative text (ADR-006).
    - name: Run mdux-docs-lint
      run: |
        python3 -m unittest discover -s tools/docs-lint -p "test_*.py"
        python3 tools/docs-lint/mdux_docs_lint.py

    # Issue #223: CONTRIBUTING.md fixes one shape for a file-level Doxygen block. A block without
    # @file is not ignored by Doxygen; it silently documents whatever declaration follows.
    - name: Check file-level Doxygen blocks
      run: python3 tools/docs-lint/check_file_headers.py

    # Issue #249: prose can name a control that does not exist, or a workflow whose green tick
    # proves nothing because it never runs automatically. This resolves only the mechanical subset:
    # workflow triggers, ctest labels and literal CMake/tool target names. It deliberately does not
    # claim to decide whether the surrounding prose is true.
    - name: Resolve CI mechanisms named by documentation
      run: python3 tools/docs-lint/check_named_mechanisms.py

    # Every AI-Reference.md is generated, so an edited module with a stale index is a defect the
    # build should catch rather than a reader. --check writes nothing; it fails when regenerating
    # would change a byte, and when a clause is cited in prose that no index row covers.
    - name: Check AI-Reference indexes are current
      run: python3 tools/docs-lint/generate_ai_reference.py --check

    # Issue #265: the host-tool manifest is generated from `add_executable()` and the
    # `mdux_bake_artifact()` call sites, so a tool added to the build without regenerating it is a
    # manifest that looks authoritative and is incomplete.
    - name: Check the tool manifest is current
      run: python3 tools/docs-lint/generate_tool_manifest.py --check

    # Issue #33: a schema under docs/<standard>/schemas/ that has silently diverged from the
    # governance type it documents still looks authoritative. Since #264 the same run checks
    # docs/recipes/*.schema.json against every committed generated/<kind>/<id>/report.json.
    - name: Check schemas have not drifted from the types and bakers they document
      run: python3 tools/docs-lint/check_schema_type_drift.py

    # Issue #390: the component inventory records each dictionary entry against ADR-026's admission
    # criteria. Whether a criterion is met is a reviewed judgement; that the inventory lists exactly
    # the components the compiler accepts, and rests on evidence paths that exist, is not.
    - name: Check the component inventory against the grammar and ADR-026
      run: python3 tools/docs-lint/check_component_inventory.py

    # Bans decimal float formatting anywhere in the evidence pipeline (ADR-007). There used to be a
    # check that every committed report.json's toolGitSha was not "unknown"; that field no longer
    # exists (ADR-007 decision 5, issue #52), and toolVersion needs no check beyond validate()'s
    # EmptyToolVersion rejection.
    - name: Run mdux-evidence-lint
      run: |
        python3 -m unittest discover -s tools/evidence-lint -p "test_*.py"
        python3 tools/evidence-lint/mdux_evidence_lint.py

    # ADR-005's governed-zone source rules (issue #116): no throw/try/catch, no throwing `.value()`,
    # no raw allocation, no filesystem/console/clock/randomness, no unsafe cast, no std::fma. The
    # lint parses MduXCore's source list out of CMakeLists.txt rather than configuring the project.
    #
    # One of two layers. The other, governed.noThrow.symbolScan, reads the emitted objects and
    # therefore runs inside the toolchain legs as a ctest. Neither subsumes the other: this sees a
    # std::filesystem call that never throws, and the scan sees a throw arriving through a std
    # facility the source never spells out.
    - name: Run mdux-governed-lint
      run: |
        python3 -m unittest discover -s tools/governed-lint -p "test_*.py"
        python3 tools/governed-lint/mdux_governed_lint.py

    # The rule that lets a docs-only pull request skip the toolchain legs (#386). Its own tests run
    # here, on every PR, because a classifier that wrongly answered "docs only" would skip the build
    # for a change that needed it.
    - name: Test the CI change classifier
      run: python3 -m unittest discover -s tools/ci -p "test_*.py"
