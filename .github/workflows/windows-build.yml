name: Windows Build

# NOTE: This project requires C++23 import std support:
# - MSVC 17.14+ (Visual Studio 2022 v17.10+) ✅ Available in CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]

permissions:
  contents: read

jobs:
  # Windows Build with Vulkan
  windows-build:
    name: Windows (MSVC, Vulkan)
    runs-on: windows-latest
    env:
      MEDUI_CONFORMANCE_DIR: ${{ github.workspace }}/.medui-conformance

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    - name: Resolve the pinned MedUI contract commit
      id: medui-contract
      shell: bash
      run: |
        set -euo pipefail
        commit="$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' medui-conformance.toml)"
        if [ -z "$commit" ]; then
          echo "medui-conformance.toml has no 40-character commit pin" >&2
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned MedUI conformance contract
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Compliatory/MedUI
        ref: ${{ steps.medui-contract.outputs.commit }}
        path: .medui-conformance
        persist-credentials: false

    # Pinned, not 'latest': CMakeLists.txt hardcodes CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
    # to a specific UUID that only matches CMake's `import std` experimental-feature
    # ABI as of 4.1.1 - CMake changes that UUID as the feature evolves release to
    # release, so newer CMake versions reject it ("CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
    # is set to incorrect value") and import std silently stops working, cascading
    # into hundreds of "could not find module 'std'" errors at compile time. Every
    # other job in this workflow already pins 4.1.1 for the same reason (grep
    # CMAKE_VERSION="4.1.1" below) - 'latest' here was the one job that floated,
    # and it broke as soon as 'latest' moved past 4.1.1.
    - name: Setup CMake (4.1.1, matching every other job in this workflow)
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '4.1.1'

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@c25f41106918cde0bf347e6f201277392b3a9e9d # v1.2.1
      with:
        vulkan-query-version: 1.3.204.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Verify Vulkan installation
      run: |
        echo "VK_SDK_PATH: $env:VULKAN_SDK"
        if (Test-Path "$env:VULKAN_SDK\bin\vulkaninfoSDK.exe") {
          & "$env:VULKAN_SDK\bin\vulkaninfoSDK.exe" --summary
        }

    # Lavapipe, so this leg can execute the rendered-truth producer (#254).
    #
    # The component list above installs a loader without a driver, and `windows-latest` has no GPU,
    # so this runner enumerated zero physical devices until now. That was invisible while nothing
    # here rendered. It stopped being invisible when `verification.json` joined the screen bundle:
    # the file is re-derived by `mdux-verify-bake` during the ordinary build, so a leg with no ICD
    # does not produce a smaller artifact - it fails to build. ADR-007 decision 6 asks all four legs
    # to re-derive every committed artifact, and #254 forbids reading a missing device as a skip, so
    # the software rasterizer is what keeps this leg in the claim rather than an exception to it.
    #
    # Mesa's own Windows build, pinned by release tag and verified against the SHA-256 GitHub
    # records for that exact asset. An unpinned "latest" would let a third-party binary change what
    # this leg renders with between two runs of the same commit, under a byte-identity claim.
    - name: Install lavapipe (Mesa software Vulkan)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version  = '26.2.0'
        $expected = 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
        $archive  = Join-Path $env:RUNNER_TEMP 'mesa.7z'
        $target   = Join-Path $env:RUNNER_TEMP 'mesa'
        $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
        Invoke-WebRequest -Uri $url -OutFile $archive
        $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
        if ($actual -ne $expected) {
          throw "mesa3d $version is $actual, not the pinned $expected"
        }
        & 7z x $archive "-o$target" -y | Out-Null
        # Located rather than hardcoded: the archive's internal layout is Mesa's business, and a
        # moved file should fail here by name instead of as a device that silently never appears.
        # The manifest's library_path is relative, so the DLL has to stay beside it.
        $icd = Get-ChildItem -Path $target -Recurse -Filter 'lvp_icd*64*.json' | Select-Object -First 1
        if (-not $icd) {
          throw "mesa3d $version carries no 64-bit lavapipe ICD manifest"
        }
        # Both spellings, and the older one is the one that actually works here. `VK_DRIVER_FILES`
        # arrived in loader 1.3.207; the SDK pinned above is 1.3.204.0, whose loader ignores it
        # entirely and reports "no usable ICD" with the variable set correctly in the environment.
        # `VK_ICD_FILENAMES` is what that loader reads. Setting both keeps this working when the SDK
        # pin moves forward, since the newer loader prefers `VK_DRIVER_FILES`.
        "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "lavapipe ICD: $($icd.FullName)"

    - name: Install Ninja
      run: |
        $NINJA_URL = "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip"
        $NINJA_ZIP = "$env:TEMP\ninja.zip"
        $NINJA_DIR = "$env:TEMP\ninja"
        Invoke-WebRequest -Uri $NINJA_URL -OutFile $NINJA_ZIP
        Expand-Archive -Path $NINJA_ZIP -DestinationPath $NINJA_DIR -Force
        echo "$NINJA_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Locates whatever MSVC version is actually installed on the runner image via
    # vswhere and exports its environment (INCLUDE/LIB/PATH/etc.) into GITHUB_ENV
    # for every later step in this job. Replaces a hardcoded
    # ".../Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat" call that
    # broke silently when GitHub's windows-latest image moved to a newer Visual
    # Studio release with a different install path - the failure mode was `call`
    # failing to find the batch file, followed by a *different*, misleading error
    # ("'#' is not recognized...") from the now-garbled command line, not a clear
    # "path not found". Never hardcode a VS version/edition path here again.
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Configure CMake (MSVC with Ninja)
      run: cmake --preset ninja-msvc
      shell: cmd

    - name: Build
      env:
        # This leg's Vulkan device is a software rasterizer installed by hand two steps above, and
        # the build renders through it (#254). When a loader declines an ICD it does so silently and
        # reports only "no usable ICD" at vkCreateInstance, which says nothing about why. Loader
        # diagnostics turn that into the loader's own sentence, in the log, next to the bake that
        # failed.
        VK_LOADER_DEBUG: all
      run: cmake --build --preset ninja-msvc
      shell: cmd

    - name: Run Tests
      run: ctest --preset ninja-msvc
      shell: cmd

    # Byte-identity of every baked artifact, on this toolchain (ADR-007). Run as its own step
    # rather than relying on the full suite above, so a drifted artifact is unmistakable in the
    # job log instead of one line among hundreds. The corresponding Linux/GCC step is what makes
    # the claim two-toolchain - see the comment there before removing either.
    - name: Verify evidence artifacts (MSVC)
      run: ctest --preset ninja-msvc -L evidence
      shell: cmd

    # A skip here would mean the evidence step above compared a verification.json this leg did not
    # really re-derive, which #254 forbids. The same guard the GCC, Clang and macOS legs carry.
    - name: Verify rendered tests ran on lavapipe
      shell: bash
      run: |
        set -euo pipefail
        pixel_log="$RUNNER_TEMP/msvc-pixel.log"
        ctest --preset ninja-msvc -L pixel -V --no-tests=error 2>&1 | tee "$pixel_log"
        if grep -q 'Skipped' "$pixel_log"; then
          echo '::error::Pixel tests were skipped - no Vulkan device. They must run on this leg.'
          exit 1
        fi

    # Floating-point determinism (ADR-008, issue #59). The frozen bit patterns in
    # tests/ml/DeterminismTests.cpp are the contract, and this step is one half of what makes it a
    # *cross-toolchain* contract - the Linux/GCC step is the other. Neither leg alone can falsify
    # "these kernels compute the same bits everywhere", so do not reduce this to one.
    #
    # A failure here is never fixed by updating the constants. See that file's header comment.
    - name: Verify ML determinism (MSVC)
      run: ctest --preset ninja-msvc -L determinism
      shell: cmd

    # Governed-zone no-throw (ADR-005, issue #116). Informational on this toolchain, and run
    # anyway: the MSVC STL inlines its own throw sites, so _CxxThrowException in a governed object
    # is the same symbol whether it came from a hand-written throw or a std::string growth path.
    # The scan therefore forbids nothing here and prints what it found, which is worth having in
    # the log - it is the only place the MSVC-side references are visible at all. mdux-governed-lint
    # is what actually gates the rule on Windows. -V because a passing ctest prints no test output.
    - name: Verify governed-zone no-throw (MSVC, informational)
      run: ctest --preset ninja-msvc -L governed -V --no-tests=error
      shell: cmd

    - name: Verify no source-tree writes
      shell: pwsh
      run: |
        $status = git status --porcelain
        if ($status) {
          Write-Host "Build wrote into the source tree (generated/ artifacts must be staged via mdux-bake-update, never produced by a normal build):"
          Write-Host $status
          exit 1
        }
