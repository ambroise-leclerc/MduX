name: Security Analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    # Matches the PR's *base*, not its head: a base branch missing from this list means that PR
    # reports no checks at all, silently - which is worse than reporting failures. `[0-9]+-*` is
    # the scheme GitHub's "create a branch for this issue" button generates (issue number, dash,
    # slugified title) and this project's standard - see AGENTS.md "Branch naming". It is also
    # what gets a stacked PR checked, i.e. one targeting its predecessor rather than develop so a
    # reviewer sees one issue's diff instead of the cumulative one. `feat/**` predates the
    # convention and is kept for branches already in flight.
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]

permissions:
  contents: read

jobs:
  # Security and Code Quality
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No step here performs an authenticated Git operation, so the checkout token has no
      # reason to survive into .git/config where any later build or test step could read it
      # (OpenSSF Scorecard's Token-Permissions check, zizmor's `artipacked`).
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          libvulkan-dev \
          vulkan-tools \
          cppcheck \
          clang-tidy \
          wget \
          gnupg \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev

    - name: Install latest CMake
      run: |
        # Install CMake 4.x for C++23 import std support via direct download
        # Avoid libssl1.1 dependency issues in Debian containers
        CMAKE_VERSION="4.1.1"
        # Pinned SHA-256 from Kitware's own cmake-4.1.1-SHA-256.txt manifest. The tarball is
        # unpacked into /opt and put on PATH, so it builds everything this job touches; verifying
        # it is the same supply-chain discipline the SHA-pinned actions above apply. `sha256sum -c`
        # exits non-zero on a mismatch and `set -e` is on by default in a `run:` block, so
        # extraction cannot proceed past a bad or substituted download.
        CMAKE_SHA256="5a6c61cb62b38e153148a2c8d4af7b3d387f0c8c32b6dbceb5eb4af113efd65a"
        wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        echo "${CMAKE_SHA256}  cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | sha256sum -c -
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -C /opt/
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake /usr/bin/cmake
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest /usr/bin/ctest
        cmake --version

    - name: Run static analysis
      run: |
        # Static analysis with cppcheck. Directory recursion only picks up cppcheck's own known
        # extensions, which does not include *.cppm - include/ is 100% module interface units and
        # tests/ has a mix, so both would silently contribute zero files under plain directory
        # args. Passing an explicit find-built file list sidesteps that entirely.
        cppcheck --enable=all --std=c++23 --suppress=missingInclude \
          $(find include/ src/ examples/ tests/ -name "*.cpp" -o -name "*.cppm") || true

        # Configure for clang-tidy
        cmake -B build -S . -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMDUX_BUILD_EXAMPLES=ON -DMDUX_BUILD_TESTS=ON

        # Run clang-tidy on key files (if available). This project has no *.hpp - public API is
        # module interface units (*.cppm) under include/, backed by *.cpp implementation under
        # src/ - so both patterns are needed or this step silently analyzes nothing.
        #
        # Known limitation: compile_commands.json above was generated by GCC (this job runs in
        # the gcc:16 container, same as linux-gcc16-build.yml), so it carries GCC's
        # -fmodule-mapper=/import-std flags. clang-tidy is a Clang-frontend tool and does not
        # understand those, so *.cppm entries can fail to parse - this is swallowed by `|| true`
        # below like every other finding. Fixing it for real means running clang-tidy against a
        # Clang-generated compile_commands.json (the ninja-clang preset, currently unused because
        # clang-build.yml is manual-dispatch only - see that file), not something this job can do alone.
        if command -v clang-tidy &> /dev/null; then
          find include/ -name "*.cppm" -exec clang-tidy {} -p build \; || true
          find src/ -name "*.cpp" -exec clang-tidy {} -p build \; || true
        fi
