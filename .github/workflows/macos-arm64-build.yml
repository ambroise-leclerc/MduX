name: macOS Apple Silicon Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop, '[0-9]+-*', 'feat/**' ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Every other run - a push to
# develop or master, a schedule, a dispatch - gets a group of its own (its run id), so it is never
# cancelled and never replaced. A shared per-branch group would not be enough even without
# cancel-in-progress: GitHub keeps one pending run per group, so a third push would silently replace
# the second's queued run, and that develop commit would never get the post-merge run a stacked
# successor waits for (AGENTS.md "Stacked delivery").
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only edits prose skips the build job below; see the called workflow for the
  # rule. The build job's condition is `code != 'false'` under `!cancelled()`, so a classifier that
  # failed or produced nothing selects the build rather than skipping it.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  # Release build and every named gate on MoltenVK. The sanitized build is its own job below, on its
  # own runner, rather than a second build appended to this one (#386): the two used to run back to
  # back, which made this the slowest job in CI at roughly eleven minutes.
  macos-arm64:
    name: macOS arm64 (Clang, MoltenVK)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Explicitly the arm64 image; do not replace this with macos-latest, whose architecture and
    # installed toolchain can move independently of this verified target.
    runs-on: macos-26
    env:
      # Tests are independent processes - no RUN_SERIAL, RESOURCE_LOCK or fixed port anywhere - and
      # most of a case's wall time is process start-up, so they run in parallel (#386).
      CTEST_PARALLEL_LEVEL: '4'
      MEDUI_CONFORMANCE_DIR: ${{ github.workspace }}/.medui-conformance

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up the verified toolchain
      uses: ./.github/actions/setup-macos-toolchain

    # The compiler cache (#392). cppmcache keys a module consumer on the content of every BMI it
    # imports and restores the BMI a provider produces, so named-module providers and consumers are
    # cached on this toolchain; ccache, which #386 made persistent, could only be trusted with Clang
    # consumers. build.cache.namedModuleIntegrity proves a changed BMI still invalidates its
    # consumers. The action installs the released binary, checked against the release's checksums,
    # and sets CPPMCACHE_DIR, CPPMCACHE_BASEDIR and CPPMCACHE_COMPILERCHECK=content; saving and
    # restoring stay below, under this repository's policy. Pull requests restore the newest cache
    # develop saved and never save their own, so one branch cannot seed another's objects.
    - name: Install cppmcache
      uses: ambroise-leclerc/cppmcache@1f553a46b43cef643387abd6587b378afd5c2cad # v0.1.0 + setup action fix (cppmcache#8)
      with:
        version: 0.1.0
        cache: "false"

    - name: Restore the compiler cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cppmcache-cache
        key: cppmcache-macos-clang23-release-${{ github.sha }}
        restore-keys: cppmcache-macos-clang23-release-

    # cppmcache 0.1.0 has no eviction. A restored cache that has grown past the size ccache was
    # allowed here is dropped whole, and this run repopulates it. The check is made before the
    # build on purpose: made before the save, it would have develop save an empty cache. What is
    # saved can therefore exceed the limit, by at most what one build adds, until the next run.
    - name: Bound the compiler cache
      shell: bash
      run: |
        size_mb="$(du -sm "$CPPMCACHE_DIR" 2>/dev/null | cut -f1)"
        echo "compiler cache: ${size_mb:-0} MiB"
        if [ "${size_mb:-0}" -gt 1024 ]; then
          cppmcache -C
        fi

    - name: Configure
      run: cmake --preset ninja-macos-clang -DMDUX_BUILD_PREVIEW=ON -DCACHE_OPTION=cppmcache

    - name: Build
      run: cmake --build --preset ninja-macos-clang --parallel 4

    - name: Report compiler cache statistics
      if: ${{ !cancelled() }}
      run: cppmcache -s

    # Saved straight after the build, so a test failure later in the job does not lose it.
    - name: Save the compiler cache
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cppmcache-cache
        key: cppmcache-macos-clang23-release-${{ github.sha }}

    # Everything except the labels a named step below asserts, so each test runs exactly once (#386).
    # -L and -LE are regex matches against the same label strings, so this exclusion and the named
    # steps' selections cover the suite between them.
    - name: Run full test suite
      run: ctest --preset ninja-macos-clang --output-on-failure -LE "evidence|determinism|noheap|regulatory|governed|pixel|verify|conformance|studio"

    - name: Verify evidence, determinism, no-heap, and regulatory labels
      run: |
        ctest --preset ninja-macos-clang -L evidence --output-on-failure --no-tests=error
        ctest --preset ninja-macos-clang -L determinism --output-on-failure --no-tests=error
        ctest --preset ninja-macos-clang -L noheap --output-on-failure --no-tests=error
        ctest --preset ninja-macos-clang -L regulatory --output-on-failure --no-tests=error
        ctest --preset ninja-macos-clang -L governed -V --no-tests=error

    - name: Verify rendered output ran on MoltenVK
      shell: bash
      run: |
        set -euo pipefail
        pixel_log="$RUNNER_TEMP/macos-pixel.log"
        ctest --preset ninja-macos-clang -L pixel -V --no-tests=error 2>&1 | tee "$pixel_log"
        if grep -q 'Skipped' "$pixel_log"; then
          echo '::error::Pixel tests skipped; the macOS target must execute them through MoltenVK.'
          exit 1
        fi

    # The gate epic #16 opens with: `mdux-verify-ui --screen=generated/screen/<id> --locales=all`,
    # over every committed screen, on this leg's MoltenVK. `mdux_compile_screen()` registers one
    # `verify.screen.<id>` per screen, so a second committed screen is covered here without this file
    # changing - and `--no-tests=error` is what makes that automatic rather than silent: a label that
    # matched nothing would otherwise pass this step over zero screens.
    #
    # No skip guard here, unlike the pixel step above, because there is no skip to guard against:
    # `mdux-verify-ui` has no 77 status - an absent device exits 3 - and cmake/MduXCompileScreen.cmake
    # therefore sets no SKIP_RETURN_CODE. A device that vanished between the bake and the tests fails
    # this step as itself. Verified with the ICD unset: CTest reports Failed, not Skipped.
    - name: Verify committed screens against their goldens (MoltenVK)
      shell: bash
      run: ctest --preset ninja-macos-clang -L verify -V --no-tests=error

    # Shared MedUI observation-profile conformance (#314): the RENDERED vectors and the manifest
    # cases against the corpus checked out at the pinned commit. -V for the vector count and SHA in
    # the log; --no-tests=error so an empty label fails rather than passing over nothing.
    - name: Verify MedUI profile conformance
      shell: bash
      run: ctest --preset ninja-macos-clang -L conformance -V --no-tests=error

    # MedUI Studio (#327, ADR-025): the embedded frontend in headless Chrome against a real mdux-preview,
    # rendering through MoltenVK and pushing a proposal to a local bare repository. --no-tests=error: a
    # runner that lost its browser would otherwise pass this step over nothing.
    - name: Verify the MedUI Studio browser workflow
      shell: bash
      run: ctest --preset ninja-macos-clang -L studio -V --no-tests=error

    - name: Smoke-test Vulkan presentation
      run: ./build-macos-clang/examples/VulkanSCTriangleExample --smoke-test

    - name: Verify no source-tree writes
      shell: bash
      run: |
        set -euo pipefail
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "Build wrote into the source tree:"
          echo "$status"
          exit 1
        fi

    # Always, and cheap: the build's own timing record, so the next person tuning this leg's critical
    # path starts from a measurement rather than a guess (#386). Read it with ninjatracing or any
    # .ninja_log viewer.
    - name: Upload the build timing log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ninja-log-macos
        path: build-macos-clang/.ninja_log
        if-no-files-found: warn
        # The log is a dotfile, and upload-artifact skips hidden files unless told otherwise.
        include-hidden-files: true

    # Last in the job, and that position is load-bearing rather than tidy. `if: failure()` is
    # evaluated where the step sits: a failing step skips every later step that is not conditioned on
    # failure, but a step placed *before* the failure has already been passed over.
    #
    # Only on failure. The image is a measurement of the frame rather than a property of the screen,
    # so ADR-014 decision 4 keeps it out of `generated/` and #255 makes it an attachment instead -
    # which is worth nothing unless it is actually attached. `if-no-files-found` is `ignore` because
    # a failure that is not a rendered one (an unreadable artifact, a digest drift) legitimately
    # produces no image, and a red step should not gain a second red mark saying so.
    - name: Upload the rendered-truth diff images
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-diff-macos
        path: |
          build-macos-clang/verify-diff/
        if-no-files-found: ignore

    # The scenario-capture verifier's frames (#321, ADR-021 decision 3): one PNG per capture per
    # locale, a diagnostic attachment for a `verify.scenario.<id>` failure. Never committed.
    - name: Upload the scenario-capture frames
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-scenario-frames-macos
        path: |
          build-macos-clang/verify-scenario-frames/
        if-no-files-found: ignore

  # ASan and UBSan over the same toolchain, in parallel with the Release job above (#386).
  macos-arm64-sanitizers:
    name: macOS arm64 ASan + UBSan (Clang)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    env:
      # Tests are independent processes - no RUN_SERIAL, RESOURCE_LOCK or fixed port anywhere - and
      # most of a case's wall time is process start-up, so they run in parallel (#386).
      CTEST_PARALLEL_LEVEL: '4'
      MEDUI_CONFORMANCE_DIR: ${{ github.workspace }}/.medui-conformance

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up the verified toolchain
      uses: ./.github/actions/setup-macos-toolchain

    # The compiler cache (#392). cppmcache keys a module consumer on the content of every BMI it
    # imports and restores the BMI a provider produces, so named-module providers and consumers are
    # cached on this toolchain; ccache, which #386 made persistent, could only be trusted with Clang
    # consumers. build.cache.namedModuleIntegrity proves a changed BMI still invalidates its
    # consumers. The action installs the released binary, checked against the release's checksums,
    # and sets CPPMCACHE_DIR, CPPMCACHE_BASEDIR and CPPMCACHE_COMPILERCHECK=content; saving and
    # restoring stay below, under this repository's policy. Pull requests restore the newest cache
    # develop saved and never save their own, so one branch cannot seed another's objects.
    - name: Install cppmcache
      uses: ambroise-leclerc/cppmcache@1f553a46b43cef643387abd6587b378afd5c2cad # v0.1.0 + setup action fix (cppmcache#8)
      with:
        version: 0.1.0
        cache: "false"

    - name: Restore the compiler cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cppmcache-cache
        key: cppmcache-macos-clang23-asan-${{ github.sha }}
        restore-keys: cppmcache-macos-clang23-asan-

    # cppmcache 0.1.0 has no eviction. A restored cache that has grown past the size ccache was
    # allowed here is dropped whole, and this run repopulates it. The check is made before the
    # build on purpose: made before the save, it would have develop save an empty cache. What is
    # saved can therefore exceed the limit, by at most what one build adds, until the next run.
    - name: Bound the compiler cache
      shell: bash
      run: |
        size_mb="$(du -sm "$CPPMCACHE_DIR" 2>/dev/null | cut -f1)"
        echo "compiler cache: ${size_mb:-0} MiB"
        if [ "${size_mb:-0}" -gt 1024 ]; then
          cppmcache -C
        fi

    - name: Configure ASan and UBSan
      run: |
        cmake --preset ninja-macos-clang-debug \
          -DMDUX_BUILD_EXAMPLES=OFF \
          -DENABLE_SANITIZER_ADDRESS=ON \
          -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON \
          -DCACHE_OPTION=cppmcache

    - name: Build ASan and UBSan
      run: cmake --build --preset ninja-macos-clang-debug --parallel 4

    - name: Report compiler cache statistics
      if: ${{ !cancelled() }}
      run: cppmcache -s

    # Saved straight after the build, so a test failure later in the job does not lose it.
    - name: Save the compiler cache
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cppmcache-cache
        key: cppmcache-macos-clang23-asan-${{ github.sha }}

    - name: Run non-render tests under ASan and UBSan
      env:
        # macOS libobjc/libxpc process initialization retains three allocations that LeakSanitizer
        # reports for every test executable before MduX code runs. Keep ASan's memory-error checks
        # here; the Linux sanitizer job remains the leak-detection authority for non-render tests.
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # The symbol scans establish properties of the Release object files the job above builds.
      # Debug and sanitizer instrumentation deliberately change those objects; rerunning the static
      # scan here can reject instrumentation/runtime references instead of MduX behavior. The runtime
      # no-heap cases remain in this sanitized invocation. The compiler cache integrity check is a build
      # property rather than a runtime one, and the Release job runs it.
      run: ctest --preset ninja-macos-clang-debug -E 'offscreen_tests|verify_ui_pixel_test|verify\.screen\.|.*\.symbolScan|^build\.cache\.namedModuleIntegrity$' --output-on-failure --no-tests=error

    - name: Run rendered tests under ASan and UBSan
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      shell: bash
      run: |
        set -euo pipefail
        render_log="$RUNNER_TEMP/macos-asan-pixel.log"
        ctest --preset ninja-macos-clang-debug -R 'offscreen_tests|verify_ui_pixel_test|verify\.screen\.' -V --no-tests=error 2>&1 | tee "$render_log"
        if grep -q 'Skipped' "$render_log"; then
          echo '::error::Sanitized rendered-truth tests skipped.'
          exit 1
        fi

    - name: Verify no source-tree writes
      shell: bash
      run: |
        set -euo pipefail
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "Build wrote into the source tree:"
          echo "$status"
          exit 1
        fi

    # Always, and cheap: the build's own timing record, so the next person tuning this leg's critical
    # path starts from a measurement rather than a guess (#386). Read it with ninjatracing or any
    # .ninja_log viewer.
    - name: Upload the build timing log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ninja-log-macos-asan
        path: build-macos-clang-debug/.ninja_log
        if-no-files-found: warn
        # The log is a dotfile, and upload-artifact skips hidden files unless told otherwise.
        include-hidden-files: true

    # Last in the job, and that position is load-bearing rather than tidy. `if: failure()` is
    # evaluated where the step sits: a failing step skips every later step that is not conditioned on
    # failure, but a step placed *before* the failure has already been passed over.
    #
    # Only on failure. The image is a measurement of the frame rather than a property of the screen,
    # so ADR-014 decision 4 keeps it out of `generated/` and #255 makes it an attachment instead -
    # which is worth nothing unless it is actually attached. `if-no-files-found` is `ignore` because
    # a failure that is not a rendered one (an unreadable artifact, a digest drift) legitimately
    # produces no image, and a red step should not gain a second red mark saying so.
    - name: Upload the rendered-truth diff images
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-diff-macos-asan
        path: |
          build-macos-clang-debug/verify-diff/
        if-no-files-found: ignore

    # The scenario-capture verifier's frames (#321, ADR-021 decision 3): one PNG per capture per
    # locale, a diagnostic attachment for a `verify.scenario.<id>` failure. Never committed.
    - name: Upload the scenario-capture frames
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-scenario-frames-macos-asan
        path: |
          build-macos-clang-debug/verify-scenario-frames/
        if-no-files-found: ignore
