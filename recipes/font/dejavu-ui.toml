# The DejaVu Sans UI font package.
#
# Baked by mdux-textbake into generated/font/dejavu-ui/, which is committed and byte-verified by
# `ctest -L evidence` on every active toolchain (ADR-007, ADR-010).
#
# ## Provenance and license, stated plainly
#
# `dejavu-ui/DejaVuSans.ttf` is DejaVu Sans, redistributed here **unmodified**. Its terms are in
# `dejavu-ui/LICENSE-DejaVu.txt`, which is the upstream license file byte for byte - the Bitstream
# Vera terms, the Arev additions with the Tavmjong Bah notice, and the DejaVu changes in the public
# domain. Provenance and the reasoning behind that file are in `dejavu-ui/README.md`; the SOUP
# entry is in docs/governance/soup-register.toml.
#
# Two consequences worth being explicit about, because both are easy to get wrong later:
#
#   - The naming restriction in that license binds *modified* versions. MduX does not modify the
#     font - it reads it and rasterises glyphs from it - so the restriction is not engaged. A
#     future change that subsets or edits the .ttf before committing it would engage it, and would
#     need the file renamed.
#   - The license covers the font. It does not cover, and does not need to cover, the coverage
#     bitmaps this recipe bakes out of it: rasterising a glyph is use of the font, the same as
#     printing a document with it.
#
# ## The .ttf is a committed source asset, not a build output
#
# Same reasoning as the .spv files under recipes/shader/ and the .safetensors under
# recipes/model/: an artifact whose bytes depend on which version of a tool the CI image ships is
# not byte-reproducible. The font is an input, pinned by its digest in report.json. To change it,
# replace the file and run the evidence update to a fixpoint:
#
#   cmake --build <build-dir> --target mdux-bake-update
#   cmake -S . -B <build-dir>
#   cmake --build <build-dir>
#   ctest --test-dir <build-dir> -L evidence --output-on-failure
#
# Repeat those four commands until the evidence tests pass and an update pass reports that every
# artifact is already up to date. Then review the diffs to the font and every dependent text and
# screen artifact; the aggregate update target does not order their independent bakes. See
# cmake/MduXBake.cmake, "Artifacts that consume other artifacts", for the mechanism.
#
# ## Why this charset
#
# Printable ASCII plus the accented Latin the approved locales need.
#
#   - U+0020..U+007E (`basic-latin-printable`) is every glyph a `en-US` screen draws, and every
#     one of them is a *simple* outline in DejaVu Sans: 95 of 95 code points map and 95 of 95
#     produce outlines with zero composites.
#   - U+00AB..U+00FF (`latin1-accented`) and U+0152..U+0153 (`latin-extended-a-oe`) are the
#     French repertoire - the guillemets, the accented capitals and lowercase, the cedilla and
#     the OE ligatures. Most of the letters are *composite* glyphs in DejaVu Sans (a base letter
#     plus a combining accent, placed by a transform). Since #318 the TrueType parser flattens a
#     composite into a flat contour list on the host, in the baker, which is exactly the
#     pre-baking ADR-010 decision 5 names - the atlas the runtime receives still carries coverage
#     bitmaps and baked advances and nothing else.
#
# What is still out of scope, and would still fail the bake: RTL and contextual scripts,
# ligatured shaping, CFF outlines. A locale needing any of those is not one this font is approved
# for, and the `.medui` compiler's locale check (#15) is what enforces that.

[package]
id = "dejavu-ui"
source = "recipes/font/dejavu-ui/DejaVuSans.ttf"
sidecar = "atlas.bin"

# Em size in pixels. The rasteriser scales font units by pixelSize/unitsPerEm, so this is the
# only knob that changes the atlas' size, and it is recorded in report.json's options because a
# silently changed default must not leave every report looking unchanged (ADR-007).
pixelSize = 16

# Locales this package is approved for. Declared rather than inferred: the .medui compiler (#15)
# checks a screen's locale against this list, and a font that happens to contain a glyph is not
# the same as a font a manufacturer approved for that locale. `fr-FR` was added by #318, together
# with the `latin1-accented` charset range its text package needs.
[locales]
ids = ["en-US", "fr-FR"]

# The character set, as parallel arrays of scalars.
#
# mdux.tools.toml implements a deliberate subset of TOML with no [[table]] support, so a list of
# ranges is spelled as one array per field with entry N of each describing range N - the same
# shape recipes/model/ecg-demo.toml uses for its layers. The baker rejects a length mismatch by
# name rather than truncating to the shortest array.
[charset]
names           = ["basic-latin-printable", "latin1-accented", "latin-extended-a-oe"]
# Decimal, not hex: mdux.tools.toml's subset has no hexadecimal literals, and it says so rather
# than guessing. 32..126 is U+0020..U+007E (space to tilde); 171..255 is U+00AB..U+00FF (the
# guillemets « », the degree/section signs and the accented Latin-1 letters with the cedilla);
# 338..339 is U+0152..U+0153 (OE / oe).
firstCodePoints = [32, 171, 338]
lastCodePoints  = [126, 255, 339]
