# The ECG demonstrator model package.
#
# Baked by mdux-mlbake into generated/model/ecg-demo/, which is committed and byte-verified by
# `ctest -L evidence` on every active toolchain (ADR-007, ADR-008).
#
# ## Provenance, stated plainly
#
# **These weights are synthetic. They are not trained on anything, and they have no clinical
# validity whatsoever.**
#
# `ecg-demo/ecg-demo.safetensors` was produced by the script committed beside it, from a linear
# congruential generator seeded with 20260803. No ECG data, no clinical data, and no data of any
# kind was involved. The model classifies nothing: its four outputs are a deterministic function of
# its input with no learned meaning. Nothing in this repository should be read as claiming
# otherwise - see ADR-008 and docs/regulatory-compliance.md.
#
# License: the weights are generated by a script in this repository and carry its license. There is
# no third-party checkpoint here, which is why there is no upstream attribution to record.
#
# It exists to demonstrate the pipeline end to end on a committed artifact - import, validate, bake,
# self-test, predict - and to be the "before" half of issue #64's weight-swap test. Replacing it
# with a manufacturer's own qualified weights is a re-bake of this recipe against a different
# safetensors file, with **zero application source change**. That is the headline claim of ADR-008,
# decision 2, and the weight-swap test is what proves it.
#
# ## The .safetensors is a committed source asset, not a build output
#
# Same reasoning as the .spv files under recipes/shader/: an artifact whose bytes depend on which
# version of a generator the CI image ships is not byte-reproducible. To change the weights, run
#
#   python3 recipes/model/ecg-demo/generate-demonstrator-weights.py
#   cmake --build <build-dir> --target mdux-bake-update
#
# then review the diff to generated/model/ecg-demo/.

[package]
id = "ecg-demo"
source = "recipes/model/ecg-demo/ecg-demo.safetensors"

# Total floats in and out, channels included. 180 samples is one second at 180 Hz.
inputLength = 180
outputLength = 4

# maxScratchFloats is deliberately omitted. The baker derives it from the layer chain as twice the
# largest activation, and a hand-written value here could only ever agree with that or be wrong.

[goldens]
# Four vectors: the first four are the fixed patterns (zeros, ones, an alternating square wave, and
# a ramp), which between them exercise saturation, sign handling and monotone response. Beyond four
# the generator draws from the LCG.
count = 4
seed = 20260803
# Named, not implied. A seed alone does not determine a sequence, and the two CI legs have to agree
# on the algorithm as well as the seed for the bake to be byte-identical. mdux-mlbake rejects a
# value it does not implement rather than silently substituting its own.
algorithm = "lcg-numerical-recipes-32"

# The architecture (issue #64). Exercises every v1 kernel:
#
#   180 x 1 -> Conv1D k=9 s=1, 8 filters, relu  -> 172 x 8
#           -> MaxPool1D k=4 s=4                ->  43 x 8
#           -> Conv1D k=5 s=1, 16 filters, relu ->  39 x 16
#           -> Flatten                          -> 624
#           -> Dense 624 -> 4, softmax          ->   4
#
# Parallel arrays rather than an array of tables: mdux.tools.toml implements a deliberate subset
# with no [[table]] support, and the shader recipe already uses this shape. Entry N of every array
# describes layer N, and the baker rejects a length mismatch by name.
#
# Order is load-bearing. The weight blob is packed in layer order, so reordering these changes
# every byte offset in the package.
[layers]
kinds       = ["conv1d",   "maxPool1d", "conv1d",   "flatten", "dense"]
activations = ["relu",     "none",      "relu",     "none",    "softmax"]
inLengths   = [180,        172,         43,         39,        624]
inChannels  = [1,          8,           8,          16,        1]
outLengths  = [172,        43,          39,         624,       4]
outChannels = [8,          8,           16,         1,         1]
kernelSizes = [9,          4,           5,          0,         0]
strides     = [1,          4,           1,          0,         0]
weightNames = ["conv1.weight", "",      "conv2.weight", "",    "dense.weight"]
biasNames   = ["conv1.bias",   "",      "conv2.bias",   "",    "dense.bias"]
